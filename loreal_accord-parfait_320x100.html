html,body{overflow:hidden;background:#e8dbc9}
*{box-sizing:border-box}
#ad{position:relative;width:320px;height:100px;overflow:hidden;cursor:pointer;background:#e8dbc9;color:#493725;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#ad *{cursor:pointer}
.scene{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .35s}
.scene.on{opacity:1;pointer-events:auto}
.img{position:absolute;background-repeat:no-repeat;background-position:0 0;background-size:100% 100%}
.hit{position:absolute;left:0;top:0;width:100%;height:100%;display:block;margin:0;padding:0;border:0;background:transparent;touch-action:pan-y;z-index:8}
#fx{position:absolute;left:0;top:0;width:320px;height:100px;pointer-events:none}
#puff{left:0;top:0;width:0px;height:0px;opacity:0;pointer-events:none;transform-origin:center;filter:drop-shadow(0 2px 3px #53352244)}
#frame{position:absolute;left:0;top:0;width:100%;height:100%;border:1px solid #000;pointer-events:none;z-index:9}
/* тексты: строки задаются в конфиге через <br>, переносов браузера нет */
.t{position:absolute;margin:0;font-family:'Gotham',Arial,sans-serif;font-weight:700;line-height:1;white-space:nowrap}
.nofont .ln{-webkit-text-fill-color:transparent;background:currentColor;opacity:.42;border-radius:2px}
.badge{color:#fff;background:#a58155;font-weight:500;letter-spacing:.02em}
.hint-t{color:#fff;text-align:center}
/* плашка «80% ухода в составе» — одна и та же во всех сценах */
.plate{position:absolute;background:linear-gradient(180deg,rgba(186,150,102,.72),rgba(169,130,76,.9))}
.plate .t{color:#fff}
.band{position:absolute;left:0;width:100%}
.band .t{left:0;width:100%;text-align:center}
.b2{background:linear-gradient(100deg,#e8d9c6,#eee3d4);color:#5c432a}
.slogan{font-weight:500}
.fade{position:absolute;left:0;width:100%;background:linear-gradient(180deg,rgba(238,228,216,0),#eee4d8 32%)}.title3,.slogan3{color:#493725}
/* юр. информация: одна на все сцены, поверх них; клик проходит сквозь неё */
.legal{font-weight:400;color:#493725;z-index:8;pointer-events:none}
.cta{color:#fff;background:#a57e51;font-weight:500;text-align:center;letter-spacing:.03em}
/* сцена 2: полоса лица с зумом, края растушёваны */

<div id="ad" class="">


  <section class="scene on" id="s3">

    <div class="img img-pack pack k3"></div>
    <div class="plate"><div class="t pa"><span class="ln">80%</span></div><div class="t pb"><span class="ln">УХОДА В&nbsp;СОСТАВЕ*</span></div></div>
    <div class="t title3"><span class="ln">ACCORD PARFAIT</span></div>

  </section>

  <div class="t legal"><span class="ln">*Потребительский тест, 123 участника. Skin.ru ООО «Юрвес», ОГРН 1027739697138,</span><br><span class="ln">ИНН 7705048318, 125464, г. Москва, ш. Волоколамское, д. 142, офис 536</span></div>
  <div id="frame"></div>
</div>
<script>
(function(){
  /* Ссылка перехода. Пусто — ссылку ставит DSP: segmentoBanner.onclick({playerHandles:true}).
     Адрес — переход внутри баннера (<a href target=_blank>): segmentoBanner.onclick({playerHandles:false}). */
  var CLICK_URL = '';
  /* Автозапуск анимации, мс. 0 — ждём касания; больше 0 — запуск через N мс без действия пользователя. */
  var AUTOPLAY_MS = 0;
  /* Чёрная рамка 1px по краю баннера. false — без рамки. */
  var BORDER = true;

  var M = null;
  var $ = function(id){ return document.getElementById(id); };
  var go = $('go'), idle = 0;

  function sb(){ return window.segmentoBanner || null; }

  if (!BORDER) $('frame').style.display = 'none';
  if (CLICK_URL) go.href = CLICK_URL;
  go.addEventListener('click', function(e){
    var s = sb();
    if (CLICK_URL) { if (s) s.onclick({ playerHandles: false }); }
    else { e.preventDefault(); if (s) s.onclick({ playerHandles: true }); }
  });

  var play = M ? motion(M) : null;

  window.addEventListener('load', function(){
    var s = sb(); if (s) s.onload();
    if (play && AUTOPLAY_MS > 0) idle = setTimeout(function(){
      if (!document.hidden) return play();
      document.addEventListener('visibilitychange', function wait(){
        if (document.hidden) return;
        document.removeEventListener('visibilitychange', wait); play();
      });
    }, AUTOPLAY_MS);
  });

  /* Сцена 1 — тап или свайп вверх запускают нанесение (один раз), сцена 2 — без клика, сцена 3 — переход. */
  function motion(M){
    var D = M.D, P = M.pts, S = M.scale, R = M.rot, B = M.before;
    var puff = $('puff'), cv = $('fx'), ctx = cv.getContext('2d');
    var raf = 0, start = null, elapsed = 0, running = false, played = false, last = null, sy = null;
    /* фрагмент фото «до» — та же картинка, что у .img-before в сцене 1 (в файле один раз) */
    var before = new Image();
    before.src = getComputedStyle(document.querySelector('.img-before')).backgroundImage.slice(4, -1).replace(/^["']|["']$/g, '');

    function scene(n){ for (var i = 1; i <= 3; i++) $('s' + i).classList.toggle('on', i === n); }
    function ease(q){ return q*q*(3-2*q); }
    function mix(a, b, q){ return [a[0] + (b[0]-a[0])*q, a[1] + (b[1]-a[1])*q]; }
    function clear(){ ctx.setTransform(2,0,0,2,0,0); ctx.clearRect(0,0,cv.width,cv.height); }
    /* «до» поверх фото «после»; кисть стирает его — открывается «после» */
    function veil(){
      clear(); ctx.globalCompositeOperation = 'source-over';
      if (before.complete && before.naturalWidth) ctx.drawImage(before, B[0], B[1], B[2], B[3]);
      else before.onload = function(){ if (running && last === null) veil(); };
    }
    function erase(x, y){
      var r0 = M.brush[0], r1 = M.brush[1];
      ctx.globalCompositeOperation = 'destination-out';
      var g = ctx.createRadialGradient(x,y,r0,x,y,r1);
      g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(.6,'rgba(0,0,0,.8)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(x-r1-1, y-r1-1, 2*r1+2, 2*r1+2);
    }
    function draw(p, s, o, a){
      puff.style.transform = 'translate(' + (p[0]-M.size/2) + 'px,' + (p[1]-M.size/2) + 'px) scale(' + s + ') rotate(' + a + 'deg)';
      puff.style.opacity = o;
    }

    function tick(now){
      if (!running) return;
      if (start === null) start = now - elapsed;
      elapsed = Math.min(D, now - start);
      var t = elapsed / D, q, p, n, i;
      if (t < .18) {
        q = t / .18;
        p = q < .55 ? mix(P.a0, P.a1, ease(q/.55)) : mix(P.a1, P.a2, ease((q-.55)/.45));
        draw(p, S[0] + (S[1]-S[0])*ease(q), Math.min(1, t/.04), R[0] + (R[1]-R[0])*q);
      } else if (t < .76) {
        q = ease((t-.18)/.58); p = mix(P.a2, P.s1, q); p[1] -= M.arc*Math.sin(Math.PI*q);
        draw(p, S[1], 1, R[1] + (R[2]-R[1])*q);
        if (last) {
          n = Math.max(1, Math.ceil(Math.hypot(p[0]-last[0], p[1]-last[1])));
          for (i = 1; i <= n; i++) erase(last[0] + (p[0]-last[0])*i/n, last[1] + (p[1]-last[1])*i/n);
        } else erase(p[0], p[1]);
        last = p;
      } else if (t < .92) {
        q = ease((t-.76)/.16); draw(mix(P.s1, P.ex, q), S[1], 1-q, R[2]);
      } else {
        puff.style.opacity = 0; scene(3);
      }
      if (t < 1) raf = requestAnimationFrame(tick); else running = false;
    }

    function play(){
      if (running || played) return;
      clearTimeout(idle); played = true;
      veil(); last = null; scene(2);
      start = null; elapsed = 0; running = true;
      raf = requestAnimationFrame(tick);
    }

    var hot = $('start');
    hot.addEventListener('click', play);
    hot.addEventListener('pointerdown', function(e){ sy = e.clientY; });
    hot.addEventListener('pointermove', function(e){ if (sy !== null && sy - e.clientY > 20) { sy = null; play(); } });
    hot.addEventListener('pointerup', function(){ sy = null; });
    hot.addEventListener('pointercancel', function(){ sy = null; });

    document.addEventListener('visibilitychange', function(){
      if (!running) return;
      if (document.hidden) cancelAnimationFrame(raf);
      else { start = null; raf = requestAnimationFrame(tick); }
    });
    return play;
  }
})();
</script>
